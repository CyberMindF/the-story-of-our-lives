        <section class="crossword-hero" aria-labelledby="title">
          <h1 id="title">Caricamento…</h1>
          <p id="subtitle" class="subtitle"></p>
          <div class="crossword-status">
            <p id="completion-status">0 di 76 ricordi completati</p>
            <p id="check-summary" aria-live="polite">Nessun controllo eseguito.</p>
          </div>
        </section>

        <div class="layout">
          <section class="board-panel" aria-labelledby="title">
            <div class="controls">
              <button id="check-button" class="control-button" type="button" aria-label="Controlla le risposte">
                <svg class="control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6" /></svg>
                <span class="control-label">Controlla</span>
              </button>
              <button id="reset-button" class="control-button" type="button" aria-label="Ricomincia il cruciverba">
                <svg class="control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4v6h6M5.5 9A8 8 0 1 1 4 14" /></svg>
                <span class="control-label">Ricomincia</span>
              </button>
              <button id="reveal-button" class="control-button developer-control" type="button" aria-label="Rivela tutto il cruciverba" hidden>
                <svg class="control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z" /><circle cx="12" cy="12" r="2.5" /></svg>
                <span class="control-label">Rivela</span>
              </button>
            </div>
            <div id="grid-scroll" class="grid-scroll">
              <div id="grid" class="grid" role="group" aria-label="Griglia del cruciverba"></div>
            </div>
          </section>

          <aside class="clues-panel" aria-labelledby="clues-title">
            <div class="clues-panel-header">
              <h2 id="clues-title">Definizioni</h2>
              <button id="previous-clue-button" class="mobile-sheet-nav mobile-sheet-nav-previous" type="button" aria-label="Ricordo precedente">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg>
              </button>
              <button
                id="mobile-sheet-toggle"
                class="mobile-sheet-toggle"
                type="button"
                aria-expanded="false"
                aria-controls="clues-list"
              >
                <span class="mobile-clue-copy" aria-live="polite">
                  <span id="mobile-clue-kicker" class="mobile-clue-kicker">Ricordo selezionato</span>
                  <span id="mobile-clue-text" class="mobile-clue-text">Seleziona una parola per vedere la definizione.</span>
                </span>
                <span class="mobile-sheet-chevron" aria-hidden="true"></span>
                <span class="sr-only">Apri la lista delle definizioni</span>
              </button>
              <button id="next-clue-button" class="mobile-sheet-nav mobile-sheet-nav-next" type="button" aria-label="Ricordo successivo">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg>
              </button>
            </div>
            <ol id="clues-list" class="clues-list"></ol>
          </aside>
        </div>
