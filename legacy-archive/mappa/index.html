<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>🗺️ La Mappa | Mondo Bianco</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../assets/css/themes.css?v=2" />
    <link rel="stylesheet" href="../assets/css/components/shell.css?v=2" />
    <link rel="stylesheet" href="../assets/css/components/world-atmosphere.css?v=2" />
    <link rel="stylesheet" href="../assets/css/components/world-shell.css?v=3" />
    <link rel="stylesheet" href="../assets/css/components/buttons.css?v=1" />
    <link rel="stylesheet" href="../assets/css/components/cards.css?v=1" />
    <link rel="stylesheet" href="../assets/css/components/typography.css?v=1" />
    <link rel="stylesheet" href="../assets/css/pages/map.css?v=9" />
  </head>
  <body class="world-atmosphere map-page" data-logout-url="../">
    <div class="place-shell map-shell">
      <header class="place-header">
        <a class="place-home-link" href="../mondo-bianco/" aria-label="Torna al Mondo Bianco">
          <span aria-hidden="true">←</span><span class="place-name-optional">Il Mondo Bianco</span>
        </a>
        <div class="place-userbar">
          <p id="user-greeting" class="user-greeting"></p>
          <div id="theme-switcher" class="theme-switcher" role="group" aria-label="Scegli un tema"></div>
          <a href="../suggerimenti/" class="suggest-link" aria-label="Manda un suggerimento" title="Suggerisci">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-6 6c0 2.5 1.4 3.8 2.2 4.6.5.5.8 1.1.8 1.4h6c0-.3.3-.9.8-1.4.8-.8 2.2-2.1 2.2-4.6a6 6 0 0 0-6-6Z" /></svg>
          </a>
          <button id="logout-button" class="logout-button" type="button" aria-label="Esci dall'account" title="Esci">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 5H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h4M14 8l4 4-4 4M18 12H9" /></svg>
          </button>
        </div>
      </header>

      <main>
        <section class="map-hero" aria-labelledby="map-title">
          <p class="map-eyebrow">I posti che abbiamo immaginato</p>
          <h1 id="map-title"><span aria-hidden="true">🗺️</span> La Mappa</h1>
          <div id="map-introduction" class="map-introduction"></div>
        </section>

        <section class="dream-map-section" aria-labelledby="dream-map-title">
          <div class="map-section-heading">
            <p class="map-eyebrow">Le puntine</p>
            <h2 id="dream-map-title">La nostra mappa dei sogni</h2>
          </div>

          <div class="dream-map-layout">
            <div class="dream-map-scroll" tabindex="0" aria-label="Mappa visuale delle destinazioni, scorribile orizzontalmente">
              <div id="dream-map" class="dream-map">
                <img class="world-map-image" src="../assets/images/world/map/world-equal-earth.svg" alt="" aria-hidden="true" />
                <div class="map-grid" aria-hidden="true"></div>
                <div id="map-pins" class="map-pins"></div>
              </div>
            </div>

            <article id="map-preview" class="map-preview" aria-live="polite">
              <div class="map-preview-image-wrap">
                <img id="map-preview-image" class="map-preview-image" alt="" />
                <span id="map-preview-number" class="map-preview-number"></span>
              </div>
              <div class="map-preview-copy">
                <p id="map-preview-label" class="map-eyebrow"></p>
                <h3 id="map-preview-title"></h3>
                <p id="map-preview-text"></p>
                <a id="map-preview-link" href="#">Leggi questo ricordo <span aria-hidden="true">↓</span></a>
              </div>
            </article>
          </div>
        </section>

        <section class="destination-section" aria-labelledby="travel-diary-title">
          <div class="map-section-heading">
            <h2 id="travel-diary-title">Il diario di viaggio</h2>
          </div>
          <div id="destination-list" class="destination-list"></div>
          <p id="map-error" class="map-error" role="alert" hidden>Non è stato possibile caricare la mappa.</p>
        </section>

        <a class="place-bottom-link btn" href="../mondo-bianco/"><span aria-hidden="true">←</span> Torna al Mondo Bianco</a>
      </main>
    </div>

    <script type="module" src="../auth-guard.js?v=2" data-auth-gateway="../"></script>
    <script type="module" src="../assets/js/world/main.js?v=2"></script>
    <script type="module" src="../assets/js/map/main.js?v=4"></script>
  </body>
</html>
