<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>🎧 Le Cuffiette | Mondo Bianco</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../assets/css/themes.css?v=2" />
    <link rel="stylesheet" href="../assets/css/components/shell.css?v=2" />
    <link rel="stylesheet" href="../assets/css/components/world-atmosphere.css?v=2" />
    <link rel="stylesheet" href="../assets/css/components/world-shell.css?v=3" />
    <link rel="stylesheet" href="../assets/css/components/buttons.css?v=1" />
    <link rel="stylesheet" href="../assets/css/components/cards.css?v=1" />
    <link rel="stylesheet" href="../assets/css/components/typography.css?v=1" />
    <link rel="stylesheet" href="../assets/css/pages/music.css?v=1" />
  </head>
  <body class="world-atmosphere music-page" data-logout-url="../">
    <div class="place-shell music-shell">
      <header class="place-header">
        <a class="place-home-link" href="../mondo-bianco/" aria-label="Torna al Mondo Bianco">
          <span aria-hidden="true">←</span><span class="place-name-optional">Il Mondo Bianco</span>
        </a>
        <div class="place-userbar">
          <p id="user-greeting" class="user-greeting"></p>
          <div id="theme-switcher" class="theme-switcher" role="group" aria-label="Scegli un tema"></div>
          <a href="../suggerimenti/" class="suggest-link" aria-label="Manda un suggerimento" title="Suggerisci">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-6 6c0 2.5 1.4 3.8 2.2 4.6.5.5.8 1.1.8 1.4h6c0-.3.3-.9.8-1.4.8-.8 2.2-2.1 2.2-4.6a6 6 0 0 0-6-6Z" /></svg>
          </a>
          <button id="logout-button" class="logout-button" type="button" aria-label="Esci dall'account" title="Esci">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 5H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h4M14 8l4 4-4 4M18 12H9" /></svg>
          </button>
        </div>
      </header>

      <main>
        <section class="music-hero" aria-labelledby="music-title">
          <figure class="music-hero-figure">
            <img src="../assets/images/world/cuffiette.webp" alt="Un paio di cuffiette wireless su un tavolo di legno chiaro, accanto a una ciotola di rose bianche" />
          </figure>
          <h1 id="music-title"><span aria-hidden="true">🎧</span> Le Cuffiette</h1>
          <div class="playlist-card card">
            <div>
              <p class="music-eyebrow">La playlist</p>
              <p id="playlist-name" class="playlist-name"></p>
              <p id="playlist-introduction"></p>
            </div>
            <a id="playlist-link" class="btn btn-accent" href="#" target="_blank" rel="noopener noreferrer">Apri la playlist <span aria-hidden="true">↗</span></a>
          </div>
        </section>

        <section class="songs-section" aria-labelledby="songs-title">
          <div class="songs-heading">
            <p class="music-eyebrow">Nove canzoni</p>
            <h2 id="songs-title">Quelle che ho scritto pensando a noi</h2>
            <p id="songs-introduction"></p>
          </div>
          <div class="music-layout">
            <nav id="track-list" class="track-list" aria-label="Indice delle canzoni"></nav>
            <div id="songs-list" class="songs-list"></div>
          </div>
        </section>

        <section id="bonus-section" class="bonus-section" aria-labelledby="bonus-title" hidden>
          <p class="music-eyebrow">Una traccia in più</p>
          <h2 id="bonus-title">Bonus</h2>
          <audio id="bonus-audio" controls preload="none"></audio>
        </section>

        <section class="stolen-section" aria-labelledby="stolen-title">
          <p class="music-eyebrow">Frasi conservate</p>
          <h2 id="stolen-title">Parole Rubate</h2>
          <p id="stolen-introduction"></p>
          <div id="stolen-words" class="stolen-words"></div>
        </section>

        <p id="music-error" class="music-error" role="alert" hidden>Non è stato possibile caricare Le Cuffiette.</p>
        <a class="place-bottom-link btn" href="../mondo-bianco/"><span aria-hidden="true">←</span> Torna al Mondo Bianco</a>
      </main>
    </div>

    <script type="module" src="../auth-guard.js?v=2" data-auth-gateway="../"></script>
    <script type="module" src="../assets/js/world/main.js?v=2"></script>
    <script type="module" src="../assets/js/music/main.js?v=1"></script>
  </body>
</html>
