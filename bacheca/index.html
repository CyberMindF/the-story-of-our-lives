<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>📸 La Bacheca dei Ricordi | Mondo Bianco</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../assets/css/themes.css?v=2" />
    <link rel="stylesheet" href="../assets/css/components/shell.css?v=2" />
    <link rel="stylesheet" href="../assets/css/components/world-atmosphere.css?v=2" />
    <link rel="stylesheet" href="../assets/css/components/world-shell.css?v=3" />
    <link rel="stylesheet" href="../assets/css/pages/bacheca.css?v=1" />
  </head>
  <body class="world-atmosphere bacheca-page" data-logout-url="../">
    <div class="place-shell bacheca-shell">
      <header class="place-header">
        <a class="place-home-link" href="../mondo-bianco/" aria-label="Torna al Mondo Bianco">
          <span aria-hidden="true">←</span><span class="place-name-optional">Il Mondo Bianco</span>
        </a>
        <div class="place-userbar">
          <p id="user-greeting" class="user-greeting"></p>
          <div id="theme-switcher" class="theme-switcher" role="group" aria-label="Scegli un tema"></div>
          <a href="../suggerimenti/" class="suggest-link" aria-label="Manda un suggerimento" title="Suggerisci">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-6 6c0 2.5 1.4 3.8 2.2 4.6.5.5.8 1.1.8 1.4h6c0-.3.3-.9.8-1.4.8-.8 2.2-2.1 2.2-4.6a6 6 0 0 0-6-6Z" /></svg>
          </a>
          <button id="logout-button" class="logout-button" type="button" aria-label="Esci dall'account" title="Esci">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 5H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h4M14 8l4 4-4 4M18 12H9" /></svg>
          </button>
        </div>
      </header>

      <main>
        <section class="bacheca-hero" aria-labelledby="bacheca-title">
          <p class="bacheca-eyebrow">Il Mondo Bianco</p>
          <h1 id="bacheca-title"><span aria-hidden="true">📸</span> La Bacheca dei Ricordi</h1>
          <div id="bacheca-intro" class="bacheca-intro"></div>
        </section>

        <nav id="bacheca-index" class="bacheca-index" aria-label="Indice dei ricordi"></nav>

        <div id="bacheca-sections" class="bacheca-sections"></div>

        <p id="bacheca-error" class="bacheca-error" role="alert" hidden>Non è stato possibile caricare la Bacheca dei Ricordi.</p>
        <a class="place-bottom-link" href="../mondo-bianco/"><span aria-hidden="true">←</span> Torna al Mondo Bianco</a>
      </main>
    </div>

    <dialog id="bacheca-lightbox" class="bacheca-lightbox" aria-label="Foto ingrandita">
      <button id="lightbox-prev" class="lightbox-nav lightbox-prev" type="button" aria-label="Foto precedente">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6" /></svg>
      </button>
      <figure>
        <img id="lightbox-image" alt="" />
        <figcaption id="lightbox-caption"></figcaption>
      </figure>
      <button id="lightbox-next" class="lightbox-nav lightbox-next" type="button" aria-label="Foto successiva">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6" /></svg>
      </button>
      <button id="lightbox-close" class="lightbox-close" type="button" aria-label="Chiudi">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg>
      </button>
    </dialog>
    <script type="module" src="../auth-guard.js?v=2" data-auth-gateway="../"></script>
    <script type="module" src="../assets/js/world/main.js?v=2"></script>
    <script type="module" src="../assets/js/bacheca/main.js?v=1"></script>
  </body>
</html>
