<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Il Mondo Bianco</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/caveat-variable.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body>
  <script>
    // Applica il tema salvato prima del primo paint, altrimenti la pagina mostra sempre i
    // colori di default finché Angular non fa il bootstrap ed esegue ThemeService.applySavedTheme()
    // (lampo di tema sbagliato segnalato il 09/08/2026 — vedi prossimi sviluppi.md #12).
    (function () {
      try {
        document.body.classList.add('world-atmosphere');
        var theme = localStorage.getItem('noi-crossword-theme-v15');
        if (theme) {
          document.documentElement.dataset.theme = theme;
          document.body.dataset.theme = theme;
        }
      } catch (e) {}
    })();
  </script>
  <app-root></app-root>
</body>
</html>
