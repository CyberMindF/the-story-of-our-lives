<div class="place-userbar" [class]="extraClass">
  @if (userName()) {
    <a routerLink="/profilo" class="user-greeting" title="Vai al tuo profilo">Ciao, {{ userName() }}</a>
  } @else {
    <span class="user-greeting"></span>
  }
  @if (authService.isAdmin()) {
    <label class="userbar-admin-toggle" [class.is-active]="authService.adminModeEnabled()" title="Modalità admin">
      <span>Admin</span>
      <input
        type="checkbox"
        class="settings-toggle-input"
        [checked]="authService.adminModeEnabled()"
        [disabled]="changingAdminMode()"
        (change)="toggleAdminMode($event)"
        aria-label="Modalità admin"
      />
      <span class="settings-toggle-switch" aria-hidden="true"></span>
    </label>
  }
  @if (showHomeShortcut) {
    <a routerLink="/" class="home-shortcut-link" aria-label="Vai a Il Mondo Bianco" title="Il Mondo Bianco">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 4l8 7.5M6 10v9a1 1 0 0 0 1 1h4v-6h2v6h4a1 1 0 0 0 1-1v-9" /></svg>
    </a>
  }
  @if (showSuggestLink) {
    <a routerLink="/suggerimenti" class="suggest-link" aria-label="Manda un suggerimento" title="Suggerisci">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-6 6c0 2.5 1.4 3.8 2.2 4.6.5.5.8 1.1.8 1.4h6c0-.3.3-.9.8-1.4.8-.8 2.2-2.1 2.2-4.6a6 6 0 0 0-6-6Z" /></svg>
    </a>
  }
  <button
    class="notify-update-button"
    type="button"
    aria-label="Avvisa via email di un aggiornamento"
    [title]="notifySent() ? 'Avviso inviato' : 'Avvisa via email'"
    [disabled]="notifying()"
    (click)="onNotifyClick()"
  >
    @if (notifySent()) {
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5L19 7" /></svg>
    } @else {
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v16H4z" fill="none" /><path d="M4 6l8 7 8-7M4 6v12h16V6" /></svg>
    }
  </button>
  <button id="logout-button" class="logout-button" type="button" aria-label="Esci dall'account" title="Esci" [disabled]="loggingOut()" (click)="onLogoutClick()">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 5H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h4M14 8l4 4-4 4M18 12H9" /></svg>
  </button>
</div>
