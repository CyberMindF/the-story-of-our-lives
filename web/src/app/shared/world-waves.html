@if (worldSettingsService.settings().waves) {
  <div class="world-waves" aria-hidden="true">
    <svg class="world-wave world-wave-back" viewBox="0 0 2400 120" preserveAspectRatio="none">
      <path
        fill="#2f6d68"
        d="M0,40 C150,80 350,0 600,40 C850,80 1050,0 1200,40 C1350,80 1550,0 1800,40 C2050,80 2250,0 2400,40 L2400,120 L0,120 Z"
      ></path>
    </svg>
    <svg class="world-wave world-wave-mid" viewBox="0 0 2400 120" preserveAspectRatio="none">
      <path
        fill="#3f8b83"
        d="M0,55 C150,15 350,90 600,55 C850,15 1050,90 1200,55 C1350,15 1550,90 1800,55 C2050,15 2250,90 2400,55 L2400,120 L0,120 Z"
      ></path>
    </svg>
    <svg class="world-wave world-wave-front" viewBox="0 0 2400 120" preserveAspectRatio="none">
      <path
        fill="#54a89e"
        d="M0,50 C150,90 350,10 600,50 C850,90 1050,10 1200,50 C1350,90 1550,10 1800,50 C2050,90 2250,10 2400,50 L2400,120 L0,120 Z"
      ></path>
    </svg>
  </div>
}
