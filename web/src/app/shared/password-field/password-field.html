<span class="password-field-wrapper">
  <input
    [class.masked-text-input]="!showPassword()"
    type="text"
    [attr.autocomplete]="autocomplete"
    autocapitalize="none"
    spellcheck="false"
    [attr.minlength]="minlength"
    [required]="required"
    data-1p-ignore
    data-lpignore="true"
    [name]="name"
    [value]="value"
    (input)="onInput($event)"
  />
  <button
    type="button"
    class="password-field-toggle"
    [attr.aria-pressed]="showPassword()"
    [attr.aria-label]="showPassword() ? 'Nascondi password' : 'Mostra password'"
    (click)="toggleShowPassword()"
  >
    @if (showPassword()) {
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24" />
        <line x1="1" y1="1" x2="23" y2="23" />
      </svg>
    } @else {
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
        <circle cx="12" cy="12" r="3" />
      </svg>
    }
  </button>
</span>
