@if (canEdit()) {
  <section class="gdr-admin-section" aria-labelledby="gdr-admin-title">
    <div class="gdr-admin-heading">
      <h2 id="gdr-admin-title">Modifica i blocchi</h2>
      <button type="button" class="btn" (click)="togglePanel()">
        {{ panelOpen() ? 'Chiudi' : 'Apri' }} l'editor
      </button>
    </div>

    @if (panelOpen()) {
      <div class="gdr-admin-toolbar">
        @for (type of blockTypes; track type) {
          <button type="button" class="btn" (click)="insertSnippet(type, sourceTextarea)">{{ snippetLabels[type] }}</button>
        }
      </div>

      <div class="gdr-admin-split">
        <textarea
          #sourceTextarea
          class="gdr-admin-source"
          rows="20"
          [ngModel]="sourceText()"
          (ngModelChange)="updateSourceText($event)"
          (scroll)="syncScroll(sourceTextarea, previewPane)"
          name="sourceText"
          placeholder="Scrivi qui il testo del documento..."
        ></textarea>
        <div #previewPane class="gdr-admin-preview" (scroll)="syncScroll(previewPane, sourceTextarea)">
          <app-gdr-blocks [blocks]="previewBlocks()" />
        </div>
      </div>

      @if (parseErrors().length > 0) {
        <ul class="gdr-admin-errors">
          @for (error of parseErrors(); track error.line + error.message) {
            <li>{{ error.message }}</li>
          }
        </ul>
      }

      <p class="gdr-admin-form-error">{{ saveError() }}</p>

      <div class="gdr-admin-form-actions">
        <button
          type="button"
          class="btn btn-submit"
          [disabled]="parseErrors().length > 0 || saving()"
          (click)="save()"
        >
          {{ saving() ? 'Salvataggio…' : 'Salva' }}
        </button>
      </div>
    }
  </section>
}
