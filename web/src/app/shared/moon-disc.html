<div class="moon-disc" [class.is-sun]="isSun">
  @if (!isSun) {
    <div class="moon-disc-fixed" [class.is-right]="render().fixedSide === 'right'"></div>
    <div
      class="moon-disc-ellipse"
      [class.is-shadow]="render().ellipseIsShadow"
      [style.width.%]="render().ellipseWidthFraction * 100"
    ></div>
  }
</div>
