<div #root class="app-select" [class.is-pill]="variant === 'pill'" [class.is-open]="open()" [class.opens-up]="dropUp()">
  @if (name) {
    <input type="hidden" [name]="name" [value]="value" />
  }
  <button
    type="button"
    class="app-select-trigger"
    role="combobox"
    aria-haspopup="listbox"
    [attr.aria-label]="ariaLabel"
    [attr.aria-expanded]="open()"
    [attr.aria-controls]="listboxId"
    [attr.aria-required]="required"
    [class.is-placeholder]="!value"
    [disabled]="disabled"
    (click)="toggle()"
    (keydown)="onKeydown($event)"
  >
    <span>{{ selectedLabel }}</span>
    <svg viewBox="0 0 20 20" aria-hidden="true">
      <path d="m5.5 7.5 4.5 4.5 4.5-4.5" />
    </svg>
  </button>

  @if (open()) {
    <div class="app-select-menu" [id]="listboxId" role="listbox" [attr.aria-label]="ariaLabel">
      @for (option of options; track option.value) {
        <button
          type="button"
          role="option"
          [attr.aria-selected]="option.value === value"
          [class.is-selected]="option.value === value"
          (click)="choose(option)"
        >
          <span>{{ option.label }}</span>
          @if (option.value === value) {
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m4.5 10 3.4 3.4 7.6-7.6" /></svg>
          }
        </button>
      }
    </div>
  }
</div>
