@if (themeService.activeThemeId() === shellThemeId && worldSettingsService.settings().shells) {
  <div class="world-shells" aria-hidden="true">
    @for (shell of shells; track $index) {
      <span
        class="world-shell"
        [style.--shell-y]="shell.y + '%'"
        [style.--shell-size]="shell.size + 'rem'"
        [style.--shell-opacity]="shell.opacity"
        [style.--shell-bob]="shell.bob + 'px'"
        [style.--shell-drift-duration]="shell.driftDuration + 's'"
        [style.--shell-drift-delay]="shell.driftDelay + 's'"
      >🐚</span>
    }
  </div>
}
