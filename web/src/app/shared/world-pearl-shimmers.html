@if (worldSettingsService.settings().pearlShimmers) {
  <div class="world-pearl-shimmers" [attr.data-aurora]="auroraColor()" aria-hidden="true">
      <svg class="northern-aurora" viewBox="0 0 1000 1000" preserveAspectRatio="none">
        <defs>
          <linearGradient id="northern-fade" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0" stop-color="white" />
            <stop offset="1" stop-color="black" />
          </linearGradient>
          <mask id="northern-mask">
            <rect width="1000" height="1000" fill="url(#northern-fade)" />
          </mask>
          <linearGradient id="northern-green"><stop offset="0" stop-color="#39f58f" stop-opacity="0"/><stop offset=".2" stop-color="#39f58f" stop-opacity=".3"/><stop offset=".5" stop-color="#39f58f" stop-opacity=".72"/><stop offset=".8" stop-color="#39f58f" stop-opacity=".3"/><stop offset="1" stop-color="#39f58f" stop-opacity="0"/></linearGradient>
          <linearGradient id="northern-blue"><stop offset="0" stop-color="#4bc9ff" stop-opacity="0"/><stop offset=".2" stop-color="#4bc9ff" stop-opacity=".3"/><stop offset=".5" stop-color="#4bc9ff" stop-opacity=".72"/><stop offset=".8" stop-color="#4bc9ff" stop-opacity=".3"/><stop offset="1" stop-color="#4bc9ff" stop-opacity="0"/></linearGradient>
          <linearGradient id="northern-magenta"><stop offset="0" stop-color="#f05ac8" stop-opacity="0"/><stop offset=".2" stop-color="#f05ac8" stop-opacity=".3"/><stop offset=".5" stop-color="#f05ac8" stop-opacity=".7"/><stop offset=".8" stop-color="#f05ac8" stop-opacity=".3"/><stop offset="1" stop-color="#f05ac8" stop-opacity="0"/></linearGradient>
        </defs>
        <g class="northern-lights" mask="url(#northern-mask)">
          @for (light of northernLights; track $index) {
            <rect class="northern-light" [attr.x]="light.x * 10" y="-80" [attr.width]="light.width" height="1080"
              [attr.fill]="'url(#' + northernGradient(light.colorIndex) + ')'"
              [style.--northern-opacity]="light.opacity"
              [style.--northern-scale-x]="light.scaleX"
              [style.--northern-scale-y]="light.scaleY"
              [style.--northern-duration]="light.duration + 's'"
              [style.--northern-delay]="light.delay + 's'"
              (animationiteration)="commitNorthernColor(light.colorIndex)" />
          }
        </g>
      </svg>
  </div>
}
