@if (worldSettingsService.settings().balloons) {
  <div class="world-balloons" aria-hidden="true">
    @for (balloon of balloons; track $index) {
      <span
        class="world-balloon"
        [style.--balloon-x]="balloon.x + '%'"
        [style.--balloon-size]="balloon.size + 'rem'"
        [style.--balloon-opacity]="balloon.opacity"
        [style.--balloon-sway]="balloon.sway + 'px'"
        [style.--balloon-duration]="balloon.duration + 's'"
        [style.--balloon-delay]="balloon.delay + 's'"
      >
        <svg class="world-balloon-svg" viewBox="0 0 28 40">
          @switch (balloon.shape) {
            @case ('heart') {
              <path [attr.fill]="balloon.color" d="M14 30 C 4 22, 1 17, 1 12.5 C 1 8, 5 5, 9.5 5 C 12 5, 13.7 6.5, 14 8.5 C 14.3 6.5, 16 5, 18.5 5 C 23 5, 27 8, 27 12.5 C 27 17, 24 22, 14 30 Z" />
              <path class="world-balloon-string" d="M14 30 C 17 33, 11 36, 14 40" />
            }
            @case ('dog') {
              <g [attr.fill]="balloon.color">
                <ellipse cx="14" cy="19" rx="9.5" ry="6.5" />
                <ellipse cx="7" cy="14" rx="1.8" ry="3.8" transform="rotate(-40 7 14)" />
                <ellipse cx="8" cy="26" rx="1.4" ry="4" />
                <ellipse cx="12" cy="26.4" rx="1.4" ry="4" />
                <ellipse cx="17" cy="26.4" rx="1.4" ry="4" />
                <ellipse cx="21" cy="26" rx="1.4" ry="4" />
                <circle cx="21" cy="13" r="4.3" />
                <ellipse cx="17.5" cy="11.5" rx="2" ry="3.6" transform="rotate(-30 17.5 11.5)" />
                <ellipse cx="24.5" cy="12" rx="2" ry="3.6" transform="rotate(25 24.5 12)" />
              </g>
              <path class="world-balloon-string" d="M12 30.4 C 15 33.4, 9 36.4, 12 40" />
            }
            @case ('penguin') {
              <g>
                <ellipse cx="14" cy="17" rx="9" ry="13" [attr.fill]="balloon.color" />
                <ellipse cx="14" cy="19" rx="5" ry="9" fill="#f5f0e6" />
                <circle cx="11" cy="9" r="1.3" fill="#25211c" />
                <circle cx="17" cy="9" r="1.3" fill="#25211c" />
                <path d="M12.5 11 L15.5 11 L14 13.2 Z" fill="#f0a13c" />
                <ellipse cx="9" cy="29" rx="2.4" ry="1.2" fill="#f0a13c" />
                <ellipse cx="19" cy="29" rx="2.4" ry="1.2" fill="#f0a13c" />
              </g>
              <path class="world-balloon-string" d="M14 30.3 C 17 33.3, 11 36.3, 14 40" />
            }
            @default {
              <ellipse cx="14" cy="16" rx="10" ry="14" [attr.fill]="balloon.color" />
              <ellipse cx="9.5" cy="10" rx="2.6" ry="3.4" fill="rgba(255,255,255,0.35)" />
              <path class="world-balloon-string" d="M14 30 C 17 33, 11 36, 14 40" />
            }
          }
        </svg>
      </span>
    }
  </div>
}
