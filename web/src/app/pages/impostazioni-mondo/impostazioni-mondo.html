<app-shell [showSuggestLink]="false">
  <section class="settings-hero" aria-labelledby="settings-title">
    <p class="settings-eyebrow">Il Mondo Bianco</p>
    <h1 id="settings-title"><span aria-hidden="true">🕯️</span> Le impostazioni del mondo</h1>
    <p class="settings-intro">
      Effetti condivisi: quello che accendi o spegni qui lo vediamo entrambi, non è una
      preferenza solo tua.
    </p>
  </section>

  <div class="settings-list">
    <label class="settings-toggle card">
      <span class="settings-toggle-info">
        <span class="settings-toggle-title"><span aria-hidden="true">🏮</span> Lanterne che salgono</span>
        <span class="settings-toggle-description">Lanterne calde che salgono lente nel cielo del mondo.</span>
      </span>
      <input
        type="checkbox"
        class="settings-toggle-input"
        [checked]="worldSettingsService.settings().lanterns"
        (change)="toggleSetting('lanterns', $event)"
        aria-label="Lanterne che salgono"
      />
      <span class="settings-toggle-switch" aria-hidden="true"></span>
    </label>

    <label class="settings-toggle card">
      <span class="settings-toggle-info">
        <span class="settings-toggle-title"><span aria-hidden="true">✨</span> Stelle nel cielo</span>
        <span class="settings-toggle-description">Le stelle che brillano nel cielo del mondo, su ogni tema.</span>
      </span>
      <input
        type="checkbox"
        class="settings-toggle-input"
        [checked]="worldSettingsService.settings().stars"
        (change)="toggleSetting('stars', $event)"
        aria-label="Stelle nel cielo"
      />
      <span class="settings-toggle-switch" aria-hidden="true"></span>
    </label>

    <label class="settings-toggle card">
      <span class="settings-toggle-info">
        <span class="settings-toggle-title"><span aria-hidden="true">🌙</span> La luna</span>
        <span class="settings-toggle-description">La luna nel cielo del mondo, con la sua fase reale di oggi.</span>
      </span>
      <input
        type="checkbox"
        class="settings-toggle-input"
        [checked]="worldSettingsService.settings().moon"
        (change)="toggleSetting('moon', $event)"
        aria-label="La luna"
      />
      <span class="settings-toggle-switch" aria-hidden="true"></span>
    </label>
  </div>
</app-shell>
