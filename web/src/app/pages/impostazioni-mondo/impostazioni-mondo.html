<app-shell [showSuggestLink]="false">
  <section class="settings-hero" aria-labelledby="settings-title">
    <p class="settings-eyebrow">Il Mondo Bianco</p>
    <h1 id="settings-title"><span aria-hidden="true">🎛️</span> La stanza dei bottoni</h1>
    <div class="settings-intro"><app-editorial-text contentKey="impostazioni-mondo.introduzione" /></div>
  </section>

  <section class="settings-theme-section" aria-labelledby="settings-theme-title">
    <h2 id="settings-theme-title">L'aspetto del mondo</h2>
    <div class="settings-theme-intro"><app-editorial-text contentKey="impostazioni-mondo.temi.introduzione" /></div>
    <div class="settings-theme-picker">
      <app-theme-switcher />
    </div>
  </section>

  <section class="settings-effects" aria-labelledby="settings-effects-title">
    <h2 id="settings-effects-title">Cosa vive nel cielo</h2>
    <div class="settings-effects-intro"><app-editorial-text contentKey="impostazioni-mondo.effetti.introduzione" /></div>

    <h3 class="settings-group-title">Consigliato per Night Sky</h3>
    <div class="settings-list">
      <label class="settings-toggle card">
        <span class="settings-toggle-info">
          <span class="settings-toggle-title"><span aria-hidden="true">🏮</span> Lanterne che salgono</span>
          <span class="settings-toggle-description">Salgono lentamente verso il cielo.</span>
        </span>
        <input
          type="checkbox"
          class="settings-toggle-input"
          [checked]="worldSettingsService.settings().lanterns"
          (change)="toggleSetting('lanterns', $event)"
          aria-label="Lanterne che salgono"
        />
        <span class="settings-toggle-switch" aria-hidden="true"></span>
      </label>

      <label class="settings-toggle card">
        <span class="settings-toggle-info">
          <span class="settings-toggle-title"><span aria-hidden="true">✨</span> Stelle nel cielo</span>
          <span class="settings-toggle-description">Piccoli punti di luce nel cielo.</span>
        </span>
        <input
          type="checkbox"
          class="settings-toggle-input"
          [checked]="worldSettingsService.settings().stars"
          (change)="toggleSetting('stars', $event)"
          aria-label="Stelle nel cielo"
        />
        <span class="settings-toggle-switch" aria-hidden="true"></span>
      </label>

      <div class="settings-toggle-card card">
        <label class="settings-toggle">
          <span class="settings-toggle-info">
            <span class="settings-toggle-title"><span aria-hidden="true">🌙</span> La luna</span>
            <span class="settings-toggle-description">Mostrala nella fase che preferisci.</span>
          </span>
          <input
            type="checkbox"
            class="settings-toggle-input"
            [checked]="worldSettingsService.settings().moon"
            (change)="toggleSetting('moon', $event)"
            aria-label="La luna"
          />
          <span class="settings-toggle-switch" aria-hidden="true"></span>
        </label>

        <div class="settings-phase-picker">
          <label for="moon-phase-select">Fase</label>
          <app-select
            [options]="moonPhaseOptions"
            [value]="worldSettingsService.values().moon || 'auto'"
            ariaLabel="Fase della luna"
            (valueChange)="setMoonPhase($event)"
          />
        </div>
      </div>
    </div>

    <h3 class="settings-group-title">Consigliato per Red of You</h3>
    <div class="settings-list">
      <label class="settings-toggle card">
        <span class="settings-toggle-info">
          <span class="settings-toggle-title"><span aria-hidden="true">💫</span> Brillantini</span>
          <span class="settings-toggle-description">Piccoli lampi sparsi nel cielo.</span>
        </span>
        <input
          type="checkbox"
          class="settings-toggle-input"
          [checked]="worldSettingsService.settings().sparkles"
          (change)="toggleSetting('sparkles', $event)"
          aria-label="Brillantini"
        />
        <span class="settings-toggle-switch" aria-hidden="true"></span>
      </label>
    </div>

    <h3 class="settings-group-title">Consigliato per Green of Me</h3>
    <div class="settings-list">
      <label class="settings-toggle card">
        <span class="settings-toggle-info">
          <span class="settings-toggle-title"><span aria-hidden="true">🍂</span> Foglie al vento</span>
          <span class="settings-toggle-description">Cadono lente, portate da una brezza leggera.</span>
        </span>
        <input
          type="checkbox"
          class="settings-toggle-input"
          [checked]="worldSettingsService.settings().leaves"
          (change)="toggleSetting('leaves', $event)"
          aria-label="Foglie al vento"
        />
        <span class="settings-toggle-switch" aria-hidden="true"></span>
      </label>
    </div>

    <h3 class="settings-group-title">Consigliato per Ocean</h3>
    <div class="settings-list">
      <label class="settings-toggle card">
        <span class="settings-toggle-info">
          <span class="settings-toggle-title"><span aria-hidden="true">🌊</span> Onde del mare</span>
          <span class="settings-toggle-description">Scorrono lungo il fondo della pagina.</span>
        </span>
        <input
          type="checkbox"
          class="settings-toggle-input"
          [checked]="worldSettingsService.settings().waves"
          (change)="toggleSetting('waves', $event)"
          aria-label="Onde del mare"
        />
        <span class="settings-toggle-switch" aria-hidden="true"></span>
      </label>

      <div class="settings-toggle-card card">
        <label class="settings-toggle">
          <span class="settings-toggle-info">
            <span class="settings-toggle-title"><span aria-hidden="true">🐙</span> Pesci che nuotano</span>
            <span class="settings-toggle-description">Attraversano il mondo da un lato all'altro.</span>
          </span>
          <input
            type="checkbox"
            class="settings-toggle-input"
            [checked]="worldSettingsService.settings().fish"
            (change)="toggleSetting('fish', $event)"
            aria-label="Pesci che nuotano"
          />
          <span class="settings-toggle-switch" aria-hidden="true"></span>
        </label>

        <div class="settings-phase-picker">
          <label for="fish-kind-select">Forma</label>
          <app-select
            [options]="fishKindOptions"
            [value]="worldSettingsService.values().fish || 'mix'"
            ariaLabel="Forma dei pesci"
            (valueChange)="setFishKind($event)"
          />
        </div>
      </div>
    </div>

    <h3 class="settings-group-title">Consigliato per Velvet</h3>
    <div class="settings-list">
      <div class="settings-toggle-card card">
        <label class="settings-toggle">
          <span class="settings-toggle-info">
            <span class="settings-toggle-title"><span aria-hidden="true">🌸</span> Fiori che cadono</span>
            <span class="settings-toggle-description">Scendono lentamente dall'alto.</span>
          </span>
          <input
            type="checkbox"
            class="settings-toggle-input"
            [checked]="worldSettingsService.settings().petals"
            (change)="toggleSetting('petals', $event)"
            aria-label="Fiori che cadono"
          />
          <span class="settings-toggle-switch" aria-hidden="true"></span>
        </label>

        <div class="settings-phase-picker">
          <label for="petal-kind-select">Forma</label>
          <app-select
            [options]="petalKindOptions"
            [value]="worldSettingsService.values().petals || 'mix'"
            ariaLabel="Forma dei fiori"
            (valueChange)="setPetalKind($event)"
          />
        </div>
      </div>
    </div>
  </section>
</app-shell>
