<app-shell [showSuggestLink]="false">
  <section class="suggerimenti-hero" aria-labelledby="suggerimenti-title">
    <p class="suggerimenti-eyebrow">Il Mondo Bianco</p>
    <h1 id="suggerimenti-title"><span aria-hidden="true">💡</span> Suggerimenti</h1>
    <div class="suggerimenti-intro"><app-editorial-text contentKey="suggerimenti.introduzione" /></div>
  </section>

  <form class="suggestion-form" aria-label="Invia un suggerimento" #suggestionForm (ngSubmit)="submit(suggestionForm)">
    <label class="form-field">
      <span>Dove</span>
      <app-select
        name="category"
        [options]="categoryOptions"
        [value]="initialCategory"
        placeholder="Scegli dove…"
        ariaLabel="Dove applicare il suggerimento"
        [required]="true"
      />
    </label>
    <label class="form-field">
      <span>Titolo <small>(facoltativo)</small></span>
      <input type="text" name="title" maxlength="160" autocomplete="off" />
    </label>
    <label class="form-field">
      <span>Cosa vorresti aggiungere o cambiare</span>
      <textarea name="message" required maxlength="8000" placeholder="Scrivi qui la tua idea..."></textarea>
    </label>
    <div class="form-submit-row">
      <button type="submit" class="btn btn-submit" [disabled]="submission.submitting()">Invia suggerimento</button>
    </div>
    <app-form-status [message]="submission.message()" [status]="submission.status()" />
  </form>

</app-shell>
