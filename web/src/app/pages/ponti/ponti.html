<app-shell>
  <section class="ponti-hero" aria-labelledby="ponti-title">
    <figure class="ponti-hero-figure">
      <img src="assets/images/world/ponti.webp" alt="Un ponte arcobaleno luminoso che sale verso un cielo stellato" />
    </figure>
    <h1 id="ponti-title"><span aria-hidden="true">🌈</span> I Ponti</h1>
  </section>

  <section class="ponti-intro" aria-label="Il significato del Bifrost">
    <app-editorial-text contentKey="ponti.introduzione" />
  </section>

  <section class="ponti-destinations" aria-label="I collegamenti">
    <article class="ponti-card card">
      <p class="ponti-card-title"><span aria-hidden="true">📕</span> Se ti sentirai sola e avrai bisogno di me</p>
      <a class="ponti-link btn btn-accent" href="https://docs.google.com/document/d/10hqyWqgTlwno_3-9z2qafS1zLgWAsaAAYwNOpOaOzvY/edit?usp=drive_link" target="_blank" rel="noopener noreferrer">Vai <span aria-hidden="true">↗</span></a>
    </article>

    <article class="ponti-card card">
      <p class="ponti-card-title"><span aria-hidden="true">🌈</span> Bifrost</p>
      <div class="ponti-card-text"><app-editorial-text contentKey="ponti.bifrost.descrizione" /></div>
      <a class="ponti-link btn btn-accent" href="https://docs.google.com/document/d/1ov9b4AxZbLOgENju2BAqJSqMHQMIeyaVDmNqaT5dY2o/edit?usp=drive_link" target="_blank" rel="noopener noreferrer">Vai <span aria-hidden="true">↗</span></a>
    </article>

    <article class="ponti-card card">
      <p class="ponti-card-title"><span aria-hidden="true">🔐</span> Il Nostro Linguaggio</p>
      <div class="ponti-card-text"><app-editorial-text contentKey="ponti.linguaggio.descrizione" /></div>
      <a class="ponti-link btn btn-accent" routerLink="/linguaggio-segreto">Entra <span aria-hidden="true">→</span></a>
    </article>

    <article class="ponti-card card">
      <p class="ponti-card-title"><span aria-hidden="true">📧</span> Chat</p>
      <div class="ponti-card-text"><app-editorial-text contentKey="ponti.chat.descrizione" /></div>
      <a class="ponti-link btn btn-accent" routerLink="/ponti-chat">Entra <span aria-hidden="true">→</span></a>
      <a class="ponti-chat-legacy-link" href="https://docs.google.com/document/d/1V5GMJ725hLmLQ5RYgUPNXt7ZKouEpBJQ2E1IGyi8fIk/edit?tab=t.0" target="_blank" rel="noopener noreferrer">Il vecchio documento resta comunque qui <span aria-hidden="true">↗</span></a>
    </article>

    <article class="ponti-card card">
      <p class="ponti-card-title"><span aria-hidden="true">💬</span> Ti va se Ricominciamo?</p>
      <div class="ponti-card-text"><app-editorial-text contentKey="ponti.stranger-chat.descrizione" /></div>
      <a class="ponti-link btn btn-accent" routerLink="/fake-omegle">Entra <span aria-hidden="true">→</span></a>
    </article>
  </section>

</app-shell>
