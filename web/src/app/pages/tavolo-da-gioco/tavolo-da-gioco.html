<app-shell>
  <section class="tavolo-hero" aria-labelledby="tavolo-title">
    <figure class="tavolo-hero-figure">
      <img src="assets/images/world/tavolo-da-gioco.webp"
        alt="Un tavolo di vetro tra le nuvole con dadi, un personaggio da gioco di ruolo e un tabellone da gioco, tutto bianco" />
    </figure>
    <h1 id="tavolo-title"><span aria-hidden="true">🎲</span> Il Tavolo da Gioco</h1>
  </section>

  <div class="tavolo-intro">
    <app-editorial-text contentKey="tavolo.introduzione" />
  </div>

  <section class="tavolo-games" aria-labelledby="games-title">
    <div class="tavolo-section-heading">
      <p class="tavolo-eyebrow">Il tavolo</p>
      <h2 id="games-title">I giochi</h2>
    </div>
    <div class="tavolo-games-grid">
      <a class="tavolo-game-card card is-available" routerLink="/tavolo-da-gioco/cruciverba"><span
          class="tavolo-game-emoji">🧩</span><strong>Cruciverba</strong><small>Entra</small></a>
      <a class="tavolo-game-card card is-available" routerLink="/tavolo-da-gioco/gdr"><span
          class="tavolo-game-emoji">🐉</span><strong>Gioco di Ruolo</strong><small>Entra</small></a>
      <a class="tavolo-game-card card is-available" routerLink="/tavolo-da-gioco/messaggio-criptato"><span
          class="tavolo-game-emoji">🗝️</span><strong>Messaggio Criptato</strong><small>Entra</small></a>
      <a class="tavolo-game-card card is-available" routerLink="/tavolo-da-gioco/prova-a-dire-no"><span
          class="tavolo-game-emoji">👀</span><strong>Prova a Dire No</strong><small>Entra</small></a>
    </div>
  </section>

</app-shell>
