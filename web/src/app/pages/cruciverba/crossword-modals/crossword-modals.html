<app-confirmation-dialog dialogId="completion" title="Cruciverba completato" [description]="'Ho raccolto qui una parte di noi.\nHai ritrovato tutti i nostri ricordi.'" confirmLabel="Chiudi" [open]="crossword.completionModalOpen()" (confirm)="crossword.closeCompletionModal()" (cancel)="crossword.closeCompletionModal()" />

<app-confirmation-dialog dialogId="reset" title="Ricominciare da capo?" description="Questo cancellerà tutte le lettere inserite finora." confirmLabel="Cancella tutto" cancelLabel="Annulla" [open]="crossword.resetModalOpen()" (confirm)="crossword.resetProgress()" (cancel)="crossword.closeResetModal()" />

<app-confirmation-dialog dialogId="check" title="Controllare le risposte?" description="Le lettere inserite saranno indicate come corrette o errate. Le celle vuote non verranno considerate." confirmLabel="Controlla" cancelLabel="Annulla" [open]="crossword.checkModalOpen()" (confirm)="crossword.confirmCheck()" (cancel)="crossword.closeCheckModal()" />
