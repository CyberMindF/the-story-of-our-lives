<div class="modal" [class.hidden]="!crossword.completionModalOpen()" role="dialog" aria-modal="true" aria-labelledby="completion-letter-title" aria-describedby="completion-letter-text" (click)="onCompletionBackdropClick($event)">
  <div class="completion-letter card--handwritten">
    <h2 id="completion-letter-title" class="completion-letter-title">Cruciverba completato!</h2>
    <p id="completion-letter-text" class="completion-letter-body handwritten-text" [class.is-writing]="writingCompletionLetter()" [attr.aria-label]="loadedCompletionLetter()"><span aria-hidden="true">{{ displayedCompletionLetter() }}</span></p>
    <button type="button" class="btn completion-letter-close" (click)="crossword.closeCompletionModal()">Chiudi</button>
  </div>
</div>

<app-confirmation-dialog dialogId="reset" title="Ricominciare da capo?" description="Questo cancellerà tutte le lettere inserite finora." confirmLabel="Cancella tutto" cancelLabel="Annulla" [open]="crossword.resetModalOpen()" (confirm)="crossword.resetProgress()" (cancel)="crossword.closeResetModal()" />

<app-confirmation-dialog dialogId="check" title="Controllare le risposte?" description="Le lettere inserite saranno indicate come corrette o errate. Le celle vuote non verranno considerate." confirmLabel="Controlla" cancelLabel="Annulla" [open]="crossword.checkModalOpen()" (confirm)="crossword.confirmCheck()" (cancel)="crossword.closeCheckModal()" />

<div class="modal" [class.hidden]="!crossword.hintModalOpen()" role="dialog" aria-modal="true" aria-labelledby="hint-title" aria-describedby="hint-intro hint-request hint-outro" (click)="onHintBackdropClick($event)">
  <div class="modal-card hint-modal-card card--dialog">
    <h2 id="hint-title">Vuoi proprio un suggerimento?</h2>
    <p id="hint-intro">Per meritarti un aiutino, prima fai questo piccolo pegno in chat:</p>
    <p id="hint-request" class="hint-request"><strong>“{{ crossword.hintRequest() }}”</strong></p>
    <p id="hint-outro">Poi chiedimi direttamente il suggerimento.</p>
    <button type="button" class="btn hint-accept" (click)="crossword.closeHintModal()">Affare fatto <span aria-hidden="true">🤝</span></button>
  </div>
</div>
