<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Il Mondo Bianco</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
        background: #f5f7f6;
        color: #263331;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        box-sizing: border-box;
      }

      main {
        width: min(100%, 34rem);
        padding: 2rem;
        border: 1px solid #d4ddda;
        border-radius: 1rem;
        background: rgba(255, 255, 255, 0.88);
        box-shadow: 0 1rem 3rem rgba(38, 51, 49, 0.08);
      }

      h1 {
        margin-top: 0;
      }

      a {
        display: inline-block;
        margin-top: 1rem;
        padding: 0.75rem 1rem;
        border-radius: 0.65rem;
        background: #315f59;
        color: #fff;
        font-weight: 700;
        text-decoration: none;
      }

      a:focus-visible {
        outline: 3px solid #9bc6bd;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <!-- Hub provvisorio: verrà sostituito dalla migrazione fedele del Mondo Bianco. -->
    <main>
      <p>Migrazione in corso</p>
      <h1>Il Mondo Bianco</h1>
      <p>Questa è la nuova casa del progetto. Per il momento è disponibile il cruciverba nel Tavolo da Gioco.</p>
      <a href="./tavolo-da-gioco/cruciverba/">Apri il cruciverba</a>
    </main>
  </body>
</html>
