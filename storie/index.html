<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>📖 Le Storie | Mondo Bianco</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../assets/css/themes.css?v=1" />
    <link rel="stylesheet" href="../assets/css/components/shell.css?v=1" />
    <link rel="stylesheet" href="../assets/css/components/world-atmosphere.css?v=2" />
    <link rel="stylesheet" href="../assets/css/components/world-shell.css?v=2" />
    <link rel="stylesheet" href="../assets/css/pages/stories.css?v=8" />
  </head>
  <body class="world-atmosphere stories-page" data-logout-url="../">
    <div class="place-shell stories-shell">
      <header class="place-header">
        <a class="place-home-link" href="../mondo-bianco/" aria-label="Torna al Mondo Bianco">
          <span aria-hidden="true">←</span>
          <span class="place-name-optional">Il Mondo Bianco</span>
        </a>
        <div class="place-userbar">
          <p id="user-greeting" class="user-greeting"></p>
          <a href="../suggerimenti/" class="suggest-link" aria-label="Manda un suggerimento" title="Suggerisci">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-6 6c0 2.5 1.4 3.8 2.2 4.6.5.5.8 1.1.8 1.4h6c0-.3.3-.9.8-1.4.8-.8 2.2-2.1 2.2-4.6a6 6 0 0 0-6-6Z" /></svg>
          </a>
          <button id="logout-button" class="logout-button" type="button" aria-label="Esci dall'account" title="Esci">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 5H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h4M14 8l4 4-4 4M18 12H9" /></svg>
          </button>
        </div>
      </header>

      <main>
        <section class="stories-hero" aria-labelledby="stories-title">
          <figure class="stories-hero-figure">
            <img src="../assets/images/world/storie.webp" alt="Un antico libro aperto su un piedistallo bianco tra le nuvole" />
          </figure>
          <div class="stories-title-block">
            <h1 id="stories-title"><span aria-hidden="true">📖</span> Le Storie</h1>
            <p id="stories-introduction" class="stories-introduction"></p>
          </div>
        </section>

        <section class="stories-collection" aria-label="Raccolta delle storie">
          <p class="stories-eyebrow stories-collection-label">La raccolta</p>
          <div id="stories-list" class="stories-list" aria-live="polite"></div>
          <p id="stories-error" class="stories-error" role="alert" hidden>Non è stato possibile caricare le storie.</p>
        </section>

        <details class="story-suggestion">
          <summary class="suggestion-trigger">
            <span>
              <span class="stories-eyebrow">Una pagina ancora bianca</span>
              <strong>Lasciami una storia</strong>
            </span>
            <span class="suggestion-toggle" aria-hidden="true">+</span>
          </summary>

          <div class="suggestion-panel">
            <p class="suggestion-introduction">Lasciami una storia o una tua idea, e poi io la scriverò aggiungendo una nuova pagina a questa raccolta.</p>
            <form id="story-suggestion-form" class="suggestion-form" enctype="multipart/form-data">
              <label class="suggestion-field">
                <span>Titolo <small>facoltativo</small></span>
                <input name="title" type="text" maxlength="160" autocomplete="off" placeholder="Come si potrebbe chiamare?" />
              </label>

              <label class="suggestion-field suggestion-field-wide">
                <span>La storia o l’idea</span>
                <textarea name="storyText" rows="10" maxlength="50000" required placeholder="Puoi lasciarmi una storia oppure un’idea che vorresti che facessi io..."></textarea>
              </label>

              <label class="suggestion-field suggestion-field-wide">
                <span>Musica <small>facoltativa</small></span>
                <textarea name="musicNotes" rows="3" maxlength="2000" placeholder="Scrivi il titolo, incolla un link oppure raccontami che tipo di musica immagini."></textarea>
              </label>

              <label class="suggestion-field suggestion-field-wide">
                <span>Immagini <small>facoltative</small></span>
                <textarea name="imageNotes" rows="3" maxlength="2000" placeholder="Raccontami quali immagini vorresti, per esempio: un’immagine che rappresenta questo mondo."></textarea>
              </label>

              <div class="suggestion-submit-row suggestion-field-wide">
                <button id="suggestion-submit" type="submit">Lascia la storia</button>
              </div>
              <p id="suggestion-status" class="suggestion-status suggestion-field-wide" role="status" aria-live="polite"></p>
            </form>
          </div>
        </details>

        <a class="stories-home-link" href="../mondo-bianco/"><span aria-hidden="true">←</span> Torna al Mondo Bianco</a>
      </main>
    </div>

    <script type="module" src="../auth-guard.js?v=2" data-auth-gateway="../"></script>
    <script type="module" src="../assets/js/world/main.js?v=1"></script>
    <script type="module" src="../assets/js/stories/main.js?v=5"></script>
  </body>
</html>
